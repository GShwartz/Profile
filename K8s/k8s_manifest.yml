---
apiVersion: v1
kind: Namespace
metadata:
  name: gil-namespace  # Define your namespace here

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-volume
  namespace: gil-namespace  # Use the custom namespace
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"  # Path on the host machine

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-pvc
  namespace: gil-namespace  # Use the custom namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gil-deployment
  namespace: gil-namespace  # Use the custom namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gil
  
  template:
    metadata:
      labels:
        app: gil
    
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: gil
          image: gilush/profile:latest   # Use the Docker Hub image from your repository
          imagePullPolicy: Always         # Always pull the latest image from Docker Hub
          ports:
            - containerPort: 8080
          
          volumeMounts:
            - name: build-volume
              mountPath: /app/build
          
      volumes:
        - name: build-volume
          persistentVolumeClaim:
            claimName: build-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gil-service
  namespace: gil-namespace  # Use the custom namespace

spec:
  selector:
    app: gil
  
  ports:
    - name: http
      protocol: TCP
      port: 8080           # Expose service on port 8080
      targetPort: 8080      # Forward traffic to the container on port 8080
  
  type: ClusterIP          # No longer need NodePort since Ingress will handle routing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: gil-namespace  # Use the custom namespace

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  
  template:
    metadata:
      labels:
        app: nginx
    
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          
          volumeMounts:
            - name: build-volume
              mountPath: /usr/share/nginx/html
          
      volumes:
        - name: build-volume
          persistentVolumeClaim:
            claimName: build-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: gil-namespace  # Use the custom namespace

spec:
  selector:
    app: nginx
  
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  
  type: ClusterIP          # Ingress will handle the outside access

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gil-nginx-ingress
  namespace: gil-namespace  # Use the custom namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Disable SSL redirect if using HTTP

spec:
  rules:
    # Rule for GIL service
    - host: gil.example.com  # Replace with your domain or external IP
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gil-service
                port:
                  number: 8080

    # Rule for NGINX service
    - host: nginx.example.com  # Replace with your domain or external IP
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
